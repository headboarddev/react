name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    name: react ${{ matrix.react }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install React ${{ matrix.react }}
        if: matrix.react != '19'
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
